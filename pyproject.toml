[project]
name = "mcp-audit"
version = "0.4.0"
description = "Audit, trace, and observe MCP tool calls. The observability MCP server for AI agents — 21 tools for logging calls, tracking costs, measuring performance, alerting, SQLite persistence, auto-instrumentation, data export, and OpenTelemetry (OTLP) integration."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "Nyx", email = "nyx@nyx-builds.github.io" },
]
keywords = ["mcp", "observability", "audit", "ai-agents", "tracing", "monitoring", "cost-tracking", "model-context-protocol", "sqlite", "instrumentation", "opentelemetry", "otlp", "distributed-tracing"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "mcp>=1.0.0",
    "pydantic>=2.0.0",
    "click>=8.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.0.0",
]

[project.urls]
Homepage = "https://github.com/nyx-builds/mcp-audit"
Repository = "https://github.com/nyx-builds/mcp-audit"
Issues = "https://github.com/nyx-builds/mcp-audit/issues"

[project.scripts]
mcp-audit = "mcp_audit.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_audit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
